# Nightly live-week publish (same as `npm run push:live`).
# Runs in GitHub Actions so it still runs when your PC is off.
# Refreshes both trackers:
#   - O/U projection-tracker (DK / PrizePicks / Sleeper / Underdog / FanDuel / Caesars / Kalshi)
#   - matchup-tracker (round matchups + 3-balls)
# then pushes; "Projection Tracker Pages" rebuilds GitHub Pages from the new CSVs.
#
# Schedule: every day at 9:00 PM US Eastern (America/New_York), year-round.
# GitHub cron is UTC-only, so we fire at 01:00 and 02:00 UTC and gate on ET hour 21.
#
# One-time setup (repo → Settings → Secrets and variables → Actions):
#   DATAGOLF_API_KEY          (required)
#   DK_LEAGUE_URL             (optional; helps DraftKings scrape)
#   DK_SITE_SEGMENT           (optional)
#   DK_LEAGUE_ID              (optional)
#
# Manual run: Actions → "Nightly push:live" → Run workflow

name: Nightly push:live

on:
  workflow_dispatch:
  schedule:
    # 9pm Eastern: 01:00 UTC during EDT, 02:00 UTC during EST (time gate picks the right one).
    - cron: "0 1 * * *"
    - cron: "0 2 * * *"

permissions:
  contents: write

concurrency:
  group: nightly-push-live
  cancel-in-progress: false

jobs:
  push-live:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip unless 9pm Eastern (scheduled runs only)
        if: github.event_name == 'schedule'
        id: et_gate
        shell: pwsh
        run: |
          $tz = [TimeZoneInfo]::FindSystemTimeZoneById('Eastern Standard Time')
          $et = [TimeZoneInfo]::ConvertTimeFromUtc([DateTime]::UtcNow, $tz)
          if ($et.Hour -ne 21) {
            Write-Host "::notice::Skipping scheduled run — Eastern time is $($et.ToString('yyyy-MM-dd HH:mm')), not 21:xx."
            "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Eastern time is $($et.ToString('yyyy-MM-dd HH:mm')) — running nightly push:live."
            "skip=false" >> $env:GITHUB_OUTPUT
          }

      - name: Require DATAGOLF_API_KEY
        if: github.event_name != 'schedule' || steps.et_gate.outputs.skip != 'true'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace('${{ secrets.DATAGOLF_API_KEY }}')) {
            Write-Error 'Missing repo secret DATAGOLF_API_KEY (Settings → Secrets and variables → Actions).'
          }

      - name: Setup Node
        if: github.event_name != 'schedule' || steps.et_gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: alpha-caddie-web/package-lock.json

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.et_gate.outputs.skip != 'true'
        working-directory: alpha-caddie-web
        run: npm ci

      - name: Install Playwright Chromium
        if: github.event_name != 'schedule' || steps.et_gate.outputs.skip != 'true'
        working-directory: alpha-caddie-web
        run: npx playwright install --with-deps chromium

      - name: Git identity
        if: github.event_name != 'schedule' || steps.et_gate.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: npm run push:live (multi-book O/U + matchup trackers)
        if: github.event_name != 'schedule' || steps.et_gate.outputs.skip != 'true'
        working-directory: alpha-caddie-web
        env:
          GOLF_MODEL_DIR: ${{ github.workspace }}
          DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
          DK_LEAGUE_URL: ${{ secrets.DK_LEAGUE_URL }}
          DK_SITE_SEGMENT: ${{ secrets.DK_SITE_SEGMENT }}
          DK_LEAGUE_ID: ${{ secrets.DK_LEAGUE_ID }}
          # Headless books in CI (no interactive browser session).
          DK_HEADLESS: "1"
          FD_HEADLESS: "1"
          CZR_HEADLESS: "1"
          GOLF_SKIP_PROPS_CSV: "1"
          # Historical Trends: merge recent DataGolf rounds after live-in-play (lean push:live).
          GOLF_REFRESH_LIVE_SKIP_POST_CSV_MERGE: "0"
          # Always refresh both trackers (O/U + matchups/3-balls).
          GOLF_SKIP_ROUND_PROJECTION_VS_ACTUAL: "0"
          GOLF_REQUIRE_TRACKER_REFRESH: "1"
          GOLF_SKIP_MATCHUP_ODDS_UPDATE: "0"
          GOLF_REQUIRE_LIVE_PUBLISH_INVARIANTS: "1"
          GOLF_REBUILD_PRIOR_BACKTEST_PROJECTIONS: "0"
          # Multi-book O/U props + audit CSVs for projection-tracker (never skip on nightly).
          GOLF_SKIP_DK_OU: "0"
          GOLF_SKIP_PP_OU: "0"
          GOLF_SKIP_SL_OU: "0"
          GOLF_SKIP_UD_OU: "0"
          GOLF_SKIP_FD_OU: "0"
          GOLF_SKIP_KL_OU: "0"
          GOLF_SKIP_CZR_OU: "0"
          GOLF_SKIP_DK_ROUND_AUDIT_CSV: "0"
          GOLF_SKIP_PP_ROUND_AUDIT_CSV: "0"
          GOLF_SKIP_SL_ROUND_AUDIT_CSV: "0"
          GOLF_SKIP_UD_ROUND_AUDIT_CSV: "0"
          GOLF_SKIP_FD_ROUND_AUDIT_CSV: "0"
          GOLF_SKIP_CZR_ROUND_AUDIT_CSV: "0"
          GOLF_SKIP_KL_ROUND_AUDIT_CSV: "0"
        run: npm run push:live
