# Nightly live-week publish (same as `npm run push:live`).
# Runs in GitHub Actions so it still runs when your PC is off.
# Refreshes both trackers:
#   - O/U projection-tracker (DK / PrizePicks / Sleeper / Underdog / FanDuel / Caesars / Kalshi)
#   - matchup-tracker (round matchups + 3-balls)
# then pushes; "Projection Tracker Pages" rebuilds GitHub Pages from the new CSVs.
#
# Schedule: 01:00 UTC = 9:00 PM Eastern Daylight Time (EDT).
#   During EST (winter) that is 8:00 PM Eastern — adjust cron if you need exact 9pm year-round.
#
# One-time setup (repo → Settings → Secrets and variables → Actions):
#   DATAGOLF_API_KEY          (required)
#   DK_LEAGUE_URL             (optional; helps DraftKings scrape)
#   DK_SITE_SEGMENT           (optional)
#   DK_LEAGUE_ID              (optional)
#
# Manual run: Actions → "Nightly push:live" → Run workflow

name: Nightly push:live

on:
  workflow_dispatch:
  schedule:
    # 9:00 PM Eastern Daylight Time
    - cron: "0 1 * * *"

permissions:
  contents: write

concurrency:
  group: nightly-push-live
  cancel-in-progress: false

jobs:
  push-live:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: alpha-caddie-web/package-lock.json

      - name: Install dependencies
        working-directory: alpha-caddie-web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: alpha-caddie-web
        run: npx playwright install --with-deps chromium

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: npm run push:live (multi-book O/U + matchup trackers)
        working-directory: alpha-caddie-web
        env:
          GOLF_MODEL_DIR: ${{ github.workspace }}
          DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
          DK_LEAGUE_URL: ${{ secrets.DK_LEAGUE_URL }}
          DK_SITE_SEGMENT: ${{ secrets.DK_SITE_SEGMENT }}
          DK_LEAGUE_ID: ${{ secrets.DK_LEAGUE_ID }}
          # Headless books in CI (no interactive browser session).
          DK_HEADLESS: "1"
          FD_HEADLESS: "1"
          CZR_HEADLESS: "1"
          GOLF_SKIP_PROPS_CSV: "1"
          # Always refresh both trackers (O/U + matchups/3-balls).
          GOLF_SKIP_ROUND_PROJECTION_VS_ACTUAL: "0"
          GOLF_REQUIRE_TRACKER_REFRESH: "1"
          GOLF_REBUILD_PRIOR_BACKTEST_PROJECTIONS: "0"
          # Multi-book O/U props + audit CSVs for projection-tracker (never skip on nightly).
          GOLF_SKIP_DK_OU: "0"
          GOLF_SKIP_PP_OU: "0"
          GOLF_SKIP_SL_OU: "0"
          GOLF_SKIP_UD_OU: "0"
          GOLF_SKIP_FD_OU: "0"
          GOLF_SKIP_KL_OU: "0"
          GOLF_SKIP_CZR_OU: "0"
          GOLF_SKIP_DK_ROUND_AUDIT_CSV: "0"
          GOLF_SKIP_PP_ROUND_AUDIT_CSV: "0"
          GOLF_SKIP_SL_ROUND_AUDIT_CSV: "0"
          GOLF_SKIP_UD_ROUND_AUDIT_CSV: "0"
          GOLF_SKIP_FD_ROUND_AUDIT_CSV: "0"
          GOLF_SKIP_CZR_ROUND_AUDIT_CSV: "0"
          GOLF_SKIP_KL_ROUND_AUDIT_CSV: "0"
        run: npm run push:live
