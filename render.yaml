# Alpha Caddie on Render — use a Web Service (this blueprint), not a Static Site.
# `npm start` → serve-with-refresh.mjs: book odds + in-play when DATAGOLF_API_KEY is set.
#
# Dashboard → Environment: set secret DATAGOLF_API_KEY (required for fetch:book-odds + in-play).
# Optional: DK_LEAGUE_URL (full DraftKings golf league URL with ?category=round) if slug from event_name mismatches DK.
#
# Fresh DraftKings round props: Chromium is installed at build time; do NOT set GOLF_SKIP_DK_OU (omit it or set "0").
# Server re-runs fetch-book-odds on an interval (default 60s, GOLF_BOOK_ODDS_SERVER_POLL_MS); the browser polls
# projections.json so the UI picks up new DK lines without a manual refresh.
#
# To disable DK scrape (faster builds / no Playwright): set GOLF_SKIP_DK_OU=1 in the Render dashboard (Round projections
# DK market list will stay empty unless you commit DK-tagged props from elsewhere).
#
# Optional: GOLF_SKIP_LIVE_IN_PLAY_POLL_SERVER=1, GOLF_FETCH_DG_SERVER_POLL_MS=1800000, GOLF_SKIP_BOOK_ODDS_POLL_SERVER=1
services:
  - type: web
    name: alpha-caddie-web
    runtime: node
    rootDir: alpha-caddie-web
    buildCommand: npm install && npx playwright install chromium
    startCommand: npm start
    healthCheckPath: /
