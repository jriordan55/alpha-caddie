# Alpha Caddie on Render — use a Web Service (this blueprint), not a Static Site.
# `npm start` → serve-with-refresh.mjs + serve-static-no-json-cache.mjs (JSON responses are never edge-cached).
#
# Dashboard → Environment: set secret DATAGOLF_API_KEY (required for fetch:book-odds + in-play).
# Round props (DraftKings): set DK_LEAGUE_URL when slug inference misses (e.g. Truist:
# https://sportsbook.draftkings.com/leagues/golf/truist-championship?category=round ).
# If Playwright/API returns empty props, try DK_SITE_SEGMENT (default US-MA-SB) for your geo, e.g. US-VA-SB.
#
# Fresh DraftKings round props: Chromium is installed at build time; do NOT set GOLF_SKIP_DK_OU (omit it or set "0").
# Server re-runs fetch-book-odds on an interval (default 60s, GOLF_BOOK_ODDS_SERVER_POLL_MS); the browser polls
# projections.json so the UI picks up new DK lines without a manual refresh.
#
# Dual PGA weeks: fetch:dg compares field-updates + get-schedule anchor + timestamps (override tours: GOLF_FIELD_UPDATES_TOUR_CANDIDATES).
#
# Boot: full fetch:dg before book odds so projections.json is never stuck on git for this dyno (set GOLF_RENDER_SYNC_FETCH_DG_ON_BOOT=0 if deploy times out).
# Week rollover: fetch-book-odds also compares datagolf_field_week_key vs /field-updates (skip inline: GOLF_SKIP_INLINE_FETCH_DG_ON_EVENT_MISMATCH=1).
#
# If the Round projections table is empty: delete GOLF_SKIP_DK_OU in the Render dashboard (env vars override this file).
# With skip on, fetch-book-odds may not merge props; the UI falls back to csv/model_fallback rows when no DK tags exist.
#
# Optional: GOLF_SKIP_LIVE_IN_PLAY_POLL_SERVER=1, GOLF_FETCH_DG_SERVER_POLL_MS=1800000, GOLF_SKIP_BOOK_ODDS_POLL_SERVER=1
services:
  - type: web
    name: alpha-caddie-web
    runtime: node
    rootDir: alpha-caddie-web
    buildCommand: npm install && npx playwright install chromium
    startCommand: npm start
    healthCheckPath: /
    envVars:
      # Sync rebuild once per deploy/restart before merging odds (avoids serving last week’s git snapshot).
      - key: GOLF_RENDER_SYNC_FETCH_DG_ON_BOOT
        value: "1"
      # Off by default in fetch-datagolf; only set "1" when DG field-updates titles lag (wrong-week pret metadata has burned labels before).
      - key: GOLF_ALIGN_EVENT_TITLE_FROM_PRETOURNAMENT
        value: "0"
      # Keep DraftKings scrape enabled on Render.
      - key: GOLF_SKIP_DK_OU
        value: "0"
      # Rebuild/merge sportsbook + DK props every minute.
      - key: GOLF_BOOK_ODDS_SERVER_POLL_MS
        value: "60000"
      # Full fetch:dg (field / course / model rows). Interval clamped to at least 5 minutes server-side.
      # Required with unified pipeline so live weeks still refresh full projections periodically.
      - key: GOLF_FETCH_DG_SERVER_POLL_MS
        value: "600000"
      # Prefer live API + DK props over static CSV props on Render.
      - key: GOLF_SKIP_PROPS_CSV
        value: "1"
