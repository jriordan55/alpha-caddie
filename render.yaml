# Alpha Caddie on Render — use a Web Service (this blueprint), not a Static Site.
# `npm start` → serve-with-refresh.mjs: book odds + in-play when DATAGOLF_API_KEY is set.
#
# Dashboard → Environment: set secret DATAGOLF_API_KEY.
# Commit alpha-caddie-web/projections.json, or set ALPHA_CADDIE_START_FETCH_DG=1 for a slow first-boot fetch:dg.
#
# GOLF_SKIP_DK_OU=1 (default below) skips Playwright/DraftKings props on Render. To enable DK: delete that env var
# and use buildCommand: npm install && npx playwright install chromium
#
# Optional: GOLF_SKIP_LIVE_IN_PLAY_POLL_SERVER=1, GOLF_FETCH_DG_SERVER_POLL_MS=1800000, DK_LEAGUE_URL, DK_LEAGUE_ID.
services:
  - type: web
    name: alpha-caddie-web
    runtime: node
    rootDir: alpha-caddie-web
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: GOLF_SKIP_DK_OU
        value: "1"
